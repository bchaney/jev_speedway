<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Speedway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23f97316%27/%3E%3C/svg%3E">
<style>
:root { --bg:#0b0d12; --panel:#141822; --ink:#e8eaf0; --muted:#8a93a6; --line:#242a38; --accent:#f97316; --mono:ui-monospace,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 var(--sans); }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:15px; margin:0; } header .sub { color:var(--muted); font-size:12px; }
.ctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.ctl label { color:var(--muted); font-size:12px; display:flex; gap:4px; align-items:center; }
select, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
button { cursor:pointer; } button.icon { width:32px; padding:4px 0; text-align:center; font-size:14px; line-height:1; } button.primary { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
main { display:grid; grid-template-columns: 1fr 380px; gap:10px; padding:10px 14px; }
canvas { width:100%; background:#0f1320; border:1px solid var(--line); border-radius:10px; display:block; }
.side { display:flex; flex-direction:column; gap:8px; overflow:auto; max-height: calc(100vh - 70px); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; border-left:4px solid var(--c, #fff); }
.card h3 { margin:0 0 2px; font-size:13px; display:flex; justify-content:space-between; }
.card .traits { color:var(--muted); font-size:11px; margin-bottom:6px; }
.dec { display:grid; grid-template-columns: 82px 1fr 40px; gap:6px; align-items:center; font-size:11px; margin:2px 0; }
.dec .k { color:var(--muted); font-family:var(--mono); } .dec .v { font-family:var(--mono); text-align:right; }
.bar { height:8px; background:var(--line); border-radius:3px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--c,#fff); }
.dec.dim { opacity:.45; }
.stand { font-family:var(--mono); font-size:12px; } .stand div { display:flex; justify-content:space-between; padding:2px 0; }
.stats { color:var(--muted); font-size:11px; font-family:var(--mono); }
.log { font-family:var(--mono); font-size:11px; color:var(--muted); max-height:140px; overflow:auto; }
.log b { color:var(--ink); font-weight:500; }
details summary { cursor:pointer; color:var(--muted); font-size:12px; }
pre { font:11px/1.35 var(--mono); background:#0b0d12; border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; max-height:320px; margin:6px 0 0; }
@media (max-width: 900px) { main { grid-template-columns:1fr; } .side { max-height:none; } }
</style>
</head>
<body>
<header>
  <div><h1>Jev Speedway</h1><div class="sub">code drives the cars at 60 fps · Jev makes each driver's judgment calls a few times a second</div></div>
  <div class="ctl">
    <label>Provider <select id="provider"></select></label>
    <label>Model <select id="model"></select></label>
    <label>Laps <select id="laps"><option>2</option><option selected>3</option><option>5</option></select></label>
    <label>Think every <select id="tick"><option value="500">0.5 s</option><option value="800" selected>0.8 s</option><option value="1500">1.5 s</option></select></label>
    <button id="play" class="primary icon" title="Start race" aria-label="Start race">▶</button>
    <button id="reset" class="icon" title="Reset the race" aria-label="Reset the race">↺</button>
    <label>Track <select id="preset"><option value="original">Original</option><option value="cota">Circuit of the Americas</option></select></label>
    <button id="randomize" title="Code drafts five random circuits; Jev picks the one that makes the best race for these drivers">New track</button>
  </div>
</header>
<main>
  <div>
    <canvas id="c" width="1100" height="720"></canvas>
    <details style="margin-top:8px"><summary>Last request / response for the selected driver (click a driver card)</summary><pre id="raw">–</pre></details>
  </div>
  <div class="side">
    <div class="card" style="--c:#fff"><h3>Standings <span id="racestate" class="stats"></span></h3><div id="standings" class="stand"></div><div id="stats" class="stats"></div></div>
    <div id="drivers"></div>
    <div class="card" style="--c:#555"><h3>Race log</h3><div id="log" class="log"></div></div>
  </div>
</main>
<script type="module" src="/race.js"></script>
</body>
</html>
